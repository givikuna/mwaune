[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
dirs = "6.0.0"
sha2 = "0.10.9"
blake3 = "1.8.7"
lopdf = "0.36.0"
epub = "2.1.5"
fuzzy-matcher = "0.3.7"
tokio-util = "0.7.19"
mime_guess = "2.0.5"
regex = "1.13.1"
uuid = { version = "1.20.0", features = ["v4"] }
pdf-extract = "0.12.0"
chrono = "0.4.45"
